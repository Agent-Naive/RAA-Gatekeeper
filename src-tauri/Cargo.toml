[package]
name = "raa-gatekeeper"
version = "0.1.0"
description = "Read-only security auditor for AI-assisted development"
authors = ["Agent-Naive"]
edition = "2021"

[lib]
name = "raa_gatekeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# Data & Security
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dotenvy = "0.15"

# Networking (The AI Cogs)
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
